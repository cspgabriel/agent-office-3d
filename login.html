<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Acesso restrito · Agent Office</title>
    <link rel="icon" href="/brand/logo.svg" />
    <style>
      :root { color-scheme: dark; font-family: "Inter", "Segoe UI", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; color: #e8eef8;
        background: radial-gradient(ellipse at 30% 10%, #1b3a6b 0%, #0a1120 55%), #0a1120;
      }
      .card {
        width: min(380px, 92vw); background: rgba(15, 26, 46, 0.92); border: 1px solid #2c4066; border-radius: 16px;
        padding: 28px 26px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
      .logo {
        width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; color: #fff;
        background: linear-gradient(135deg, #2ec4b6, #1e6fd9 55%, #f6b94a);
      }
      .brand b { display: block; font-size: 17px; }
      .brand small { color: #8d9bb5; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
      label { display: block; font-size: 13px; color: #8d9bb5; margin-bottom: 6px; }
      input {
        width: 100%; padding: 11px 12px; border-radius: 9px; border: 1px solid #2c4066; background: #0a1120; color: inherit; font-size: 15px;
      }
      input:focus { outline: 2px solid rgba(46, 196, 182, 0.5); }
      button {
        width: 100%; margin-top: 14px; padding: 11px; border-radius: 9px; border: 1px solid #2ec4b6; cursor: pointer; font-size: 15px;
        color: #fff; background: linear-gradient(180deg, #23a597, #1b8a7e); font-weight: 600;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .err { color: #ff8a80; font-size: 13px; min-height: 18px; margin-top: 10px; }
      .foot { color: #5f6f8c; font-size: 11px; margin-top: 16px; text-align: center; }
    </style>
  </head>
  <body>
    <form class="card" id="f">
      <div class="brand">
        <img src="/brand/logo.svg" alt="Agent Office" style="width:48px;height:48px;border-radius:12px" />
        <div><b>Escritório de Agentes</b><small>Agent Office · acesso restrito</small></div>
      </div>
      <label for="p">Senha</label>
      <input id="p" type="password" autocomplete="current-password" required autofocus />
      <button type="submit">Entrar</button>
      <div class="err" id="e" role="alert"></div>
      <div class="foot">Uso interno da equipe Agent Office.</div>
    </form>
    <script>
      const f = document.getElementById("f");
      f.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const btn = f.querySelector("button");
        const err = document.getElementById("e");
        btn.disabled = true;
        err.textContent = "";
        try {
          const r = await fetch("/api/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ password: document.getElementById("p").value }),
          });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(j.error || "Não foi possível entrar.");
          location.replace(location.pathname === "/login" ? "/" : location.href);
        } catch (e) {
          err.textContent = e.message;
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
